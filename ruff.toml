# Pin the lint rule set so CI results do not change with the installed Ruff
# version (requirements.txt allows ruff>=0.7.0). These are Ruff's classic
# defaults: pycodestyle errors (E4, E7, E9) and Pyflakes (F).
[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Semgrep test targets intentionally contain unsafe and unused code.
"tests/fixtures/**" = ["F"]
